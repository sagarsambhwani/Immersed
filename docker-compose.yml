version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app
    environment:
      - DATABASE_URL=sqlite:///./chatbot.db
      - DEFAULT_LLM_PROVIDER=mock
      - DEFAULT_LLM_MODEL=mock-gpt
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data:
